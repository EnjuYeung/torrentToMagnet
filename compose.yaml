services:
  torrent-to-magnet:
    image: torrent-to-magnet:local
    build:
      context: .
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    init: true
    restart: unless-stopped
